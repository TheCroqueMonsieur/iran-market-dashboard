name: Update data and deploy dashboard

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/market.json'
  schedule:
    - cron: '30 11 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and validate Iranian market data
        run: python scripts/build_market_data.py

      - name: Commit refreshed dataset
        run: |
          if ! git diff --quiet -- data/market.json || [ -n "$(git status --porcelain data/market.json)" ]; then
            git config user.name "iran-market-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/market.json
            git commit -m "Update market data"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
